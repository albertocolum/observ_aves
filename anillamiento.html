<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anillamiento y Biometría - Tracking Ornitológico</title>
  
  <!-- Estilos Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    .map-header-container {
      position: relative;
      height: 320px;
      width: 100%;
      border-bottom: 3px solid #2b6cb0;
    }
    .map-instance { height: 100%; width: 100%; }

    .main-container {
      max-width: 1400px;
      margin: -30px auto 40px auto;
      position: relative;
      z-index: 1000;
    }

    .card-panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 25px;
      height: 100%;
    }

    .form-title { color: #2d3748; font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 15px; font-size: 1.25rem; }
    .section-subtitle { font-size: 0.85rem; font-weight: 700; color: #2b6cb0; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 15px; margin-bottom: 10px; }
    .form-label { font-weight: 600; color: #4a5568; font-size: 0.85rem; }
    .required-asterisk { color: #e53e3e; }
    
    .table-history { font-size: 0.82rem; }
  </style>
</head>
<body>

  <!-- ================= VISTA DE ANILLAMIENTO Y BIOMETRÍA ================= -->
  <div id="vista-anillamiento">
    <div class="map-header-container">
      <div id="map-anillamiento" class="map-instance"></div>
    </div>

    <div class="container-fluid main-container">
      <div class="row g-4">
        <!-- COLUMNA IZQUIERDA: FORMULARIO DE CAPTURA -->
        <div class="col-lg-5">
          <div class="card-panel">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <h4 class="form-title mb-0" style="border:none; padding:0;">Anillamiento y Biometría</h4>
              <a href="index.html" class="btn btn-outline-secondary btn-sm">&larr; Volver al Inicio</a>
            </div>
            <hr class="mt-2 mb-3">

            <form id="form-anillamiento">
              <div class="section-subtitle">1. Estación y Ubicación</div>
              <div class="row g-2 mb-2">
                <div class="col-md-7">
                  <label class="form-label">Coordenadas (Lat, Long) <span class="required-asterisk">*</span></label>
                  <div class="input-group input-group-sm">
                    <input type="text" id="input-coords-anil" class="form-control" value="39.7709, -0.1840" onchange="actualizarMapaAnilDesdeCoords()">
                    <button class="btn btn-outline-secondary" type="button" onclick="actualizarMapaAnilDesdeCoords()">Centrar</button>
                  </div>
                </div>
                <div class="col-md-5">
                  <label class="form-label">Fecha <span class="required-asterisk">*</span></label>
                  <input type="date" id="input-fecha-anil" class="form-control form-control-sm" required>
                </div>
              </div>

              <div class="mb-2">
                <label class="form-label">Lugar / Estación de Anillamiento <span class="required-asterisk">*</span></label>
                <input type="text" id="input-localidad-anil" class="form-control form-control-sm" placeholder="Se autocompletará con las coordenadas..." required>
              </div>

              <div class="section-subtitle">2. Marcaje e Identificación</div>
              <div class="row g-2 mb-2">
                <div class="col-md-6">
                  <label class="form-label">Anilla Metálica <span class="required-asterisk">*</span></label>
                  <input type="text" id="input-metal-anil" class="form-control form-control-sm" placeholder="Ej: Icona N-12345" required>
                </div>
                <div class="col-md-6">
                  <label class="form-label">Anilla PVC / Marca Alar</label>
                  <input type="text" id="input-pvc-anil" class="form-control form-control-sm" placeholder="Ej: A5J (Verde)">
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-6">
                  <label class="form-label">Especie <span class="required-asterisk">*</span></label>
                  <select id="input-especie-anil" class="form-select form-select-sm" required>
                    <option value="Tyto alba" selected>Lechuza común (Tyto alba)</option>
                    <option value="Falco tinnunculus">Cernícalo vulgar (Falco tinnunculus)</option>
                    <option value="Athene noctua">Mochuelo europeo (Athene noctua)</option>
                    <option value="Otus scops">Autillo europeo (Otus scops)</option>
                    <option value="Asio otus">Búho chico (Asio otus)</option>
                    <option value="Strix aluco">Cárabo común (Strix aluco)</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Edad EURING</label>
                  <select id="input-edad-anil" class="form-select form-select-sm">
                    <option value="1">1 (Pullus)</option>
                    <option value="2">2 (Volantón)</option>
                    <option value="3" selected>3 (1er año)</option>
                    <option value="4">4 (+1 año)</option>
                    <option value="5">5 (2º año)</option>
                    <option value="6">6 (Adulto)</option>
                  </select>
                </div>
                <div class="col-md-3">
                  <label class="form-label">Sexo</label>
                  <select id="input-sexo-anil" class="form-select form-select-sm">
                    <option value="Desconocido">? (Doubtful)</option>
                    <option value="Macho">Macho (M)</option>
                    <option value="Hembra">Hembra (F)</option>
                  </select>
                </div>
              </div>

              <div class="section-subtitle">3. Datos Biométricos</div>
              <div class="row g-2 mb-2">
                <div class="col-md-3">
                  <label class="form-label">Ala Máx (mm)</label>
                  <input type="number" step="0.1" id="input-ala-anil" class="form-control form-control-sm" placeholder="mm">
                </div>
                <div class="col-md-3">
                  <label class="form-label">P8 (mm)</label>
                  <input type="number" step="0.1" id="input-p8-anil" class="form-control form-control-sm" placeholder="mm">
                </div>
                <div class="col-md-3">
                  <label class="form-label">Cola (mm)</label>
                  <input type="number" step="0.1" id="input-cola-anil" class="form-control form-control-sm" placeholder="mm">
                </div>
                <div class="col-md-3">
                  <label class="form-label">R5 (mm / %)</label>
                  <input type="text" id="input-r5-anil" class="form-control form-control-sm" placeholder="Muestreo R5">
                </div>
              </div>

              <div class="row g-2 mb-2">
                <div class="col-md-4">
                  <label class="form-label">Tarso (mm)</label>
                  <input type="number" step="0.1" id="input-tarso-anil" class="form-control form-control-sm" placeholder="mm">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Masa / Peso (g)</label>
                  <input type="number" step="0.1" id="input-peso-anil" class="form-control form-control-sm" placeholder="g">
                </div>
                <div class="col-md-4">
                  <label class="form-label">Grasa / Músculo</label>
                  <input type="text" id="input-grasa-anil" class="form-control form-control-sm" placeholder="Ej: G2 / M3">
                </div>
              </div>

              <div class="mb-2">
                <label class="form-label">Anillador</label>
                <input type="text" id="input-anillador-anil" class="form-control form-control-sm" value="Alberto de la Rosa">
              </div>

              <button type="button" class="btn btn-success w-100 fw-bold mt-3" onclick="guardarAnillamiento()">
                + Guardar Captura y Biometría
              </button>
            </form>
          </div>
        </div>

        <!-- COLUMNA DERECHA: TABLA Y ACCIONES -->
        <div class="col-lg-7">
          <div class="card-panel">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div>
                <h4 class="form-title mb-1" style="border:none; padding:0;">Capturas y Registros Biométricos</h4>
                <small class="text-muted">Base de datos de anillamiento científico</small>
              </div>
              <div class="btn-group">
                <button class="btn btn-outline-danger btn-sm" onclick="eliminarUltimoAnil()" title="Borrar último registro">🗑️</button>
                <button class="btn btn-outline-dark btn-sm" onclick="vaciarTodoAnil()" title="Vaciar toda la base local">⚠️ Vaciar</button>
                
                <!-- BOTÓN DE IMPORTAR (JSON y CSV) -->
                <button class="btn btn-outline-secondary btn-sm" onclick="document.getElementById('input-file-json').click()" title="Cargar datos JSON o CSV">📥 Importar</button>
                <input type="file" id="input-file-json" accept=".json,.csv" style="display:none;" onchange="importarArchivoAnil(event)">

                <button class="btn btn-outline-success btn-sm" onclick="exportarExcelAnil()">📊 Excel</button>
                <button class="btn btn-outline-primary btn-sm" onclick="exportarKMLAnil()">🌍 KML</button>
              </div>
            </div>

            <div class="table-responsive">
              <table class="table table-hover align-middle table-history">
                <thead class="table-light">
                  <tr>
                    <th>#</th>
                    <th>Fecha</th>
                    <th>Metálica</th>
                    <th>PVC</th>
                    <th>Especie</th>
                    <th>Ala</th>
                    <th>P8</th>
                    <th>Cola</th>
                    <th>Tarso</th>
                    <th>Peso</th>
                  </tr>
                </thead>
                <tbody id="tabla-registros-anil">
                  <tr><td colspan="10" class="text-center text-muted py-3">No hay capturas guardadas.</td></tr>
                </tbody>
              </table>
            </div>

            <!-- CONTROLES DE PAGINACIÓN -->
            <div class="d-flex justify-content-between align-items-center mt-3 pt-2 border-top" id="paginacion-container" style="display: none !important;">
              <button class="btn btn-outline-primary btn-sm px-3" id="btn-anterior" onclick="cambiarPagina(-1)">&larr; Anterior</button>
              <span id="info-paginacion" class="small fw-semibold text-muted">Página 1 de 1</span>
              <button class="btn btn-outline-primary btn-sm px-3" id="btn-siguiente" onclick="cambiarPagina(1)">Siguiente &rarr;</button>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCRIPT Y LÓGICA DE FUNCIONAMIENTO -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    var mapAnil, markerAnil, capaAnil;
    var paginaActual = 1;
    var registrosPorPagina = 15;

    function obtenerLocalidad(lat, lng, targetInputId) {
      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`)
        .then(res => res.json())
        .then(data => {
          if (data && data.display_name) {
            var address = data.address || {};
            var lugar = address.city || address.town || address.village || address.municipality || address.county || data.display_name.split(',')[0];
            var provincia = address.province || address.state || '';
            var pais = address.country_code ? address.country_code.toUpperCase() : '';
            document.getElementById(targetInputId).value = provincia ? `${lugar} / ${provincia} (${pais})` : `${lugar} (${pais})`;
          }
        })
        .catch(err => console.error('No se pudo obtener la localidad:', err));
    }

    var todayStr = new Date().toISOString().slice(0,10);
    document.getElementById('input-fecha-anil').value = todayStr;

    function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

    var anillamientos = JSON.parse(localStorage.getItem("anillamiento_biometria_data")) || [];

    function initMapaAnillamiento() {
      mapAnil = L.map('map-anillamiento').setView([39.7709, -0.1840], 11);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '&copy; OpenStreetMap contributors' }).addTo(mapAnil);
      
      markerAnil = L.marker([39.7709, -0.1840], {draggable: true}).addTo(mapAnil);

      mapAnil.on('click', function(e) {
        markerAnil.setLatLng(e.latlng);
        document.getElementById('input-coords-anil').value = e.latlng.lat.toFixed(4) + ", " + e.latlng.lng.toFixed(4);
        obtenerLocalidad(e.latlng.lat, e.latlng.lng, 'input-localidad-anil');
      });

      markerAnil.on('dragend', function(e) {
        var ll = markerAnil.getLatLng();
        document.getElementById('input-coords-anil').value = ll.lat.toFixed(4) + ", " + ll.lng.toFixed(4);
        obtenerLocalidad(ll.lat, ll.lng, 'input-localidad-anil');
      });

      capaAnil = L.layerGroup().addTo(mapAnil);
      renderizarAnillamientos();
    }

    function actualizarMapaAnilDesdeCoords() {
      var p = document.getElementById('input-coords-anil').value.split(',');
      if (p.length === 2 && !isNaN(parseFloat(p[0])) && !isNaN(parseFloat(p[1]))) {
        var lat = parseFloat(p[0]), lng = parseFloat(p[1]);
        markerAnil.setLatLng([lat, lng]);
        mapAnil.setView([lat, lng], 13);
        obtenerLocalidad(lat, lng, 'input-localidad-anil');
      } else {
        alert("Introduce coordenadas válidas separadas por coma.");
      }
    }

    function guardarAnillamiento() {
      var c = document.getElementById('input-coords-anil').value.split(',');
      var lat = parseFloat(c[0]), lng = parseFloat(c[1]);
      if (isNaN(lat) || isNaN(lng)) return alert("Coordenadas no válidas.");
      if (!document.getElementById('input-fecha-anil').value || !document.getElementById('input-localidad-anil').value.trim() || !document.getElementById('input-metal-anil').value.trim()) return alert("Rellena fecha, lugar y anilla metálica.");

      var item = {
        id: anillamientos.reduce(function(m,a){return Math.max(m,a.id||0);},0) + 1,
        fecha: document.getElementById('input-fecha-anil').value,
        localidad: document.getElementById('input-localidad-anil').value,
        metal: document.getElementById('input-metal-anil').value.trim(),
        pvc: document.getElementById('input-pvc-anil').value.trim() || "-",
        especie: document.getElementById('input-especie-anil').value,
        edad: document.getElementById('input-edad-anil').value,
        sexo: document.getElementById('input-sexo-anil').value,
        ala: document.getElementById('input-ala-anil').value || "-",
        p8: document.getElementById('input-p8-anil').value || "-",
        cola: document.getElementById('input-cola-anil').value || "-",
        r5: document.getElementById('input-r5-anil').value || "-",
        tarso: document.getElementById('input-tarso-anil').value || "-",
        peso: document.getElementById('input-peso-anil').value || "-",
        grasa: document.getElementById('input-grasa-anil').value || "-",
        anillador: document.getElementById('input-anillador-anil').value,
        lat: lat, lng: lng
      };

      anillamientos.push(item);
      localStorage.setItem("anillamiento_biometria_data", JSON.stringify(anillamientos));
      
      // Al guardar, ir a la página 1 para ver el nuevo registro arriba del todo
      paginaActual = 1;
      renderizarAnillamientos();
      alert("¡Captura guardada correctamente!");
    }

    function eliminarUltimoAnil() { 
      if(anillamientos.length > 0 && confirm("¿Borrar última captura?")) { 
        anillamientos.pop(); 
        localStorage.setItem("anillamiento_biometria_data", JSON.stringify(anillamientos)); 
        renderizarAnillamientos(); 
      } 
    }

    function vaciarTodoAnil() { 
      if(confirm("¿Vaciar capturas locales?")) { 
        anillamientos = []; 
        localStorage.setItem("anillamiento_biometria_data", JSON.stringify(anillamientos)); 
        paginaActual = 1;
        renderizarAnillamientos(); 
      } 
    }

    function cambiarPagina(direccion) {
      var totalPaginas = Math.ceil(anillamientos.length / registrosPorPagina) || 1;
      paginaActual += direccion;
      if (paginaActual < 1) paginaActual = 1;
      if (paginaActual > totalPaginas) paginaActual = totalPaginas;
      renderizarTablaPaginada();
    }

    function renderizarAnillamientos() {
      if(!capaAnil) return;
      capaAnil.clearLayers();

      anillamientos.forEach(r => {
        L.circleMarker([r.lat, r.lng], { radius: 8, fillColor: '#28a745', color: '#fff', weight: 2, fillOpacity: 0.9 })
         .bindPopup(`<b>Metal: ${esc(r.metal)}</b><br>PVC: ${esc(r.pvc)}<br>Especie: ${esc(r.especie)}<br>Lugar: ${esc(r.localidad)}<br>Ala: ${r.ala} mm | Tarso: ${r.tarso} mm | Peso: ${r.peso} g`)
         .addTo(capaAnil);
      });

      renderizarTablaPaginada();
    }

    function renderizarTablaPaginada() {
      var tbody = document.getElementById('tabla-registros-anil');
      var pagContainer = document.getElementById('paginacion-container');
      if(!tbody) return;

      if (anillamientos.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-3">No hay capturas guardadas.</td></tr>';
        if(pagContainer) pagContainer.style.setProperty('display', 'none', 'important');
        return;
      }

      // Crear una copia ordenada de más reciente a más antigua para la visualización
      var datosOrdenados = [...anillamientos].sort((a, b) => {
        var fa = new Date(a.fecha.includes('/') ? a.fecha.split('/').reverse().join('-') : a.fecha);
        var fb = new Date(b.fecha.includes('/') ? b.fecha.split('/').reverse().join('-') : b.fecha);
        return fb - fa; // Orden inverso: más reciente primero
      });

      var totalPaginas = Math.ceil(datosOrdenados.length / registrosPorPagina);
      if (paginaActual > totalPaginas) paginaActual = totalPaginas;

      var inicio = (paginaActual - 1) * registrosPorPagina;
      var fin = inicio + registrosPorPagina;
      var registrosPagina = datosOrdenados.slice(inicio, fin);

      tbody.innerHTML = '';
      registrosPagina.forEach((r, idx) => {
        var numReal = datosOrdenados.length - (inicio + idx);
        var pesoTxt = r.peso !== "-" ? r.peso : "-";
        tbody.innerHTML += `<tr><td><b>#${numReal}</b></td><td>${r.fecha}</td><td><span class="badge bg-dark">${esc(r.metal)}</span></td><td><span class="badge bg-success">${esc(r.pvc)}</span></td><td><i>${esc(r.especie)}</i></td><td>${r.ala}</td><td>${r.p8}</td><td>${r.cola}</td><td>${r.tarso}</td><td>${pesoTxt}</td></tr>`;
      });

      if (datosOrdenados.length > registrosPorPagina) {
        pagContainer.style.setProperty('display', 'flex', 'important');
        document.getElementById('info-paginacion').innerText = `Página ${paginaActual} de ${totalPaginas} (${datosOrdenados.length} registros)`;
        document.getElementById('btn-anterior').disabled = (paginaActual === 1);
        document.getElementById('btn-siguiente').disabled = (paginaActual === totalPaginas);
      } else {
        pagContainer.style.setProperty('display', 'none', 'important');
      }
    }

    /* --- IMPORTAR ARCHIVO (JSON / CSV) --- */
    function importarArchivoAnil(event) {
      var file = event.target.files[0];
      if (!file) return;

      var reader = new FileReader();
      reader.onload = function(e) {
        var contenido = e.target.result;
        var extension = file.name.split('.').pop().toLowerCase();

        if (extension === 'json') {
          try {
            var datosImportados = JSON.parse(contenido);
            if (Array.isArray(datosImportados)) {
              if (confirm(`Se han encontrado ${datosImportados.length} capturas. ¿Deseas añadirlas a tus datos existentes?`)) {
                anillamientos = anillamientos.concat(datosImportados);
                anillamientos.forEach((item, index) => item.id = index + 1);
                localStorage.setItem("anillamiento_biometria_data", JSON.stringify(anillamientos));
                paginaActual = 1;
                renderizarAnillamientos();
                alert("¡Datos JSON importados y actualizados con éxito!");
              }
            } else {
              alert("El archivo JSON no tiene un formato válido.");
            }
          } catch (err) {
            alert("Error al leer el archivo JSON: " + err.message);
          }
        } else if (extension === 'csv') {
          try {
            var lineas = contenido.split(/\r\n|\n/);
            if (lineas.length < 2) return alert("El archivo CSV está vacío.");

            var separador = lineas[0].includes(';') ? ';' : ',';
            var nuevosRegistros = [];
            for (var i = 1; i < lineas.length; i++) {
              var linea = lineas[i].trim();
              if (!linea) continue;

              var cols = linea.split(separador).map(c => c.trim().replace(/^"|"$/g, ''));
              if (cols.length < 3) continue;

              var item = {
                id: 0,
                fecha: cols[1] || new Date().toISOString().slice(0,10),
                localidad: cols[2] || "Estación de Anillamiento",
                metal: cols[3] || cols[0] || "S/N",
                pvc: cols[4] || "-",
                especie: cols[5] || "Tyto alba",
                edad: cols[6] || "3",
                sexo: cols[7] || "Desconocido",
                ala: cols[8] || "-",
                p8: cols[9] || "-",
                cola: cols[10] || "-",
                r5: cols[11] || "-",
                tarso: cols[12] || "-",
                peso: cols[13] || "-",
                grasa: cols[14] || "-",
                anillador: cols[15] || "Anillador",
                lat: parseFloat(cols[16]) || 39.7709,
                lng: parseFloat(cols[17]) || -0.1840
              };
              nuevosRegistros.push(item);
            }

            if (nuevosRegistros.length > 0) {
              if (confirm(`Se han detectado ${nuevosRegistros.length} registros en el CSV. ¿Deseas importarlos?`)) {
                anillamientos = anillamientos.concat(nuevosRegistros);
                anillamientos.forEach((item, index) => item.id = index + 1);
                localStorage.setItem("anillamiento_biometria_data", JSON.stringify(anillamientos));
                paginaActual = 1;
                renderizarAnillamientos();
                alert("¡Datos CSV importados y actualizados con éxito!");
              }
            } else {
              alert("No se han podido extraer registros válidos del archivo CSV.");
            }
          } catch (err) {
            alert("Error al procesar el archivo CSV: " + err.message);
          }
        } else {
          alert("Sube un archivo .json o .csv");
        }
        event.target.value = '';
      };
      reader.readAsText(file);
    }

    /* --- EXPORTACIÓN EXCEL / CSV Y KML --- */
    function exportarExcelAnil() {
      if (!anillamientos.length) return alert("Sin datos.");
      var h = "ID;Fecha;Lugar;Metal;PVC;Especie;Edad EURING;Sexo;Ala Max(mm);P8(mm);Cola(mm);R5;Tarso(mm);Peso(g);Grasa;Anillador;Lat;Lng\n";
      var r = anillamientos.map(a => `${a.id};"${a.fecha}";"${a.localidad}";"${a.metal}";"${a.pvc}";"${a.especie}";"${a.edad}";"${a.sexo}";${a.ala};${a.p8};${a.cola};"${a.r5}";${a.tarso};${a.peso};"${a.grasa}";"${a.anillador}";${a.lat};${a.lng}`).join("\n");
      var link = document.createElement("a"); link.href = URL.createObjectURL(new Blob(["\uFEFF" + h + r], { type: 'text/csv;charset=utf-8;' }));
      link.download = "anillamiento_biometria_excel.csv"; link.click();
    }

    function exportarKMLAnil() {
      if (!anillamientos.length) return alert("Sin datos.");
      var kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Anillamiento</name>${anillamientos.map(a => `<Placemark><name>${a.metal} (${a.especie})</name><Point><coordinates>${a.lng},${a.lat},0</coordinates></Point></Placemark>`).join("")}</Document></kml>`;
      var link = document.createElement("a"); link.href = URL.createObjectURL(new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' }));
      link.download = "anillamientos_estacion.kml"; link.click();
    }

    // Inicialización al cargar la página
    window.onload = function() {
      initMapaAnillamiento();
      obtenerLocalidad(39.7709, -0.1840, 'input-localidad-anil');
    };
  </script>
