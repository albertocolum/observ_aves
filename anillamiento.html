<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Anillamiento Científico y Biometría</title>
  
  <!-- Estilos Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .map-header-container {
      position: relative;
      height: 300px;
      width: 100%;
      border-bottom: 3px solid #2b6cb0;
    }
    #map { height: 100%; width: 100%; }

    .main-container {
      max-width: 1400px;
      margin: -30px auto 40px auto;
      position: relative;
      z-index: 1000;
    }

    .card-panel {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      padding: 25px;
      height: 100%;
    }

    .form-title { color: #2d3748; font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.2rem; }
    .section-subtitle { font-size: 0.9rem; font-weight: 700; color: #2b6cb0; text-transform: uppercase; letter-spacing: 0.5px; margin-top: 15px; margin-bottom: 10px; }
    .form-label { font-weight: 600; color: #4a5568; font-size: 0.8rem; }
    .required-asterisk { color: #e53e3e; }
    
    .table-history { font-size: 0.8rem; }
  </style>
</head>
<body>

  <!-- MAPA SUPERIOR PARA UBICACIÓN DE ANILLAMIENTO -->
  <div class="map-header-container">
    <div id="map"></div>
  </div>

  <div class="container-fluid main-container">
    <div class="row g-4">
      
      <!-- FORMULARIO DE ANILLAMIENTO Y BIOMETRÍA -->
      <div class="col-lg-5">
        <div class="card-panel">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <h4 class="form-title mb-0" style="border:none; padding:0;">Ficha de Anillamiento y Biometría</h4>
            <a href="index.html" class="btn btn-outline-secondary btn-sm">&larr; Volver al Inicio</a>
          </div>
          <hr class="mt-2 mb-3">

          <form id="form-anillamiento">
            
            <!-- DATOS DE LUGAR Y FECHA -->
            <div class="section-subtitle">1. Datos Estación y Localidad</div>
            <div class="row g-2 mb-2">
              <div class="col-md-7">
                <label class="form-label">Coordenadas (Lat, Long) <span class="required-asterisk">*</span></label>
                <div class="input-group input-group-sm">
                  <input type="text" id="input-coords" class="form-control" value="39.7709, -0.1840" onchange="actualizarMapaDesdeCoordenadas()">
                  <button class="btn btn-outline-secondary" type="button" onclick="actualizarMapaDesdeCoordenadas()">Centrar</button>
                </div>
              </div>
              <div class="col-md-5">
                <label class="form-label">Fecha <span class="required-asterisk">*</span></label>
                <input type="date" id="input-fecha" class="form-control form-control-sm" required>
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label">Lugar / Estación de Anillamiento <span class="required-asterisk">*</span></label>
              <input type="text" id="input-localidad" class="form-control form-control-sm" placeholder="Obteniendo localidad..." required>
            </div>

            <!-- ANILLAS Y IDENTIFICACIÓN -->
            <div class="section-subtitle">2. Identificación y Marcaje</div>
            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label">Anilla Metálica <span class="required-asterisk">*</span></label>
                <input type="text" id="input-metal" class="form-control form-control-sm" placeholder="Ej: Icona N-12345" required>
              </div>
              <div class="col-md-6">
                <label class="form-label">Anilla PVC / Lectura a distancia</label>
                <input type="text" id="input-pvc" class="form-control form-control-sm" placeholder="Ej: A5J (Verde)">
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-md-6">
                <label class="form-label">Especie <span class="required-asterisk">*</span></label>
                <select id="input-especie" class="form-select form-select-sm" required>
                  <option value="Tyto alba" selected>Lechuza común (Tyto alba)</option>
                  <option value="Falco tinnunculus">Cernícalo vulgar (Falco tinnunculus)</option>
                  <option value="Athene noctua">Mochuelo europeo (Athene noctua)</option>
                  <option value="Otus scops">Autillo europeo (Otus scops)</option>
                  <option value="Asio otus">Búho chico (Asio otus)</option>
                  <option value="Strix aluco">Cárabo común (Strix aluco)</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Edad EURING</label>
                <select id="input-edad" class="form-select form-select-sm">
                  <option value="1">1 (Pullus)</option>
                  <option value="2">2 (Volantón)</option>
                  <option value="3" selected>3 (1er año)</option>
                  <option value="4">4 (+1 año)</option>
                  <option value="5">5 (2º año)</option>
                  <option value="6">6 (Adulto)</option>
                </select>
              </div>
              <div class="col-md-3">
                <label class="form-label">Sexo</label>
                <select id="input-sexo" class="form-select form-select-sm">
                  <option value="Desconocido">? (Doubtful)</option>
                  <option value="Macho">Macho (M)</option>
                  <option value="Hembra">Hembra (F)</option>
                </select>
              </div>
            </div>

            <!-- BIOMETRÍA -->
            <div class="section-subtitle">3. Datos Biométricos</div>
            <div class="row g-2 mb-2">
              <div class="col-md-3">
                <label class="form-label">Ala Máx. (mm)</label>
                <input type="number" step="0.1" id="input-ala" class="form-control form-control-sm" placeholder="mm">
              </div>
              <div class="col-md-3">
                <label class="form-label">P8 (mm)</label>
                <input type="number" step="0.1" id="input-p8" class="form-control form-control-sm" placeholder="mm">
              </div>
              <div class="col-md-3">
                <label class="form-label">Cola (mm)</label>
                <input type="number" step="0.1" id="input-cola" class="form-control form-control-sm" placeholder="mm">
              </div>
              <div class="col-md-3">
                <label class="form-label">Tarso (mm)</label>
                <input type="number" step="0.1" id="input-tarso" class="form-control form-control-sm" placeholder="mm">
              </div>
            </div>

            <div class="row g-2 mb-2">
              <div class="col-md-4">
                <label class="form-label">R5 (mm / %)</label>
                <input type="text" id="input-r5" class="form-control form-control-sm" placeholder="Mancha / Muestreo">
              </div>
              <div class="col-md-4">
                <label class="form-label">Masa / Peso (g)</label>
                <input type="number" step="0.1" id="input-peso" class="form-control form-control-sm" placeholder="g">
              </div>
              <div class="col-md-4">
                <label class="form-label">Grasa / Músculo</label>
                <input type="text" id="input-grasa" class="form-control form-control-sm" placeholder="Ej: G2 / M3">
              </div>
            </div>

            <div class="mb-2">
              <label class="form-label">Anillador / Equipo</label>
              <input type="text" id="input-anillador" class="form-control form-control-sm" value="Alberto de la Rosa">
            </div>

            <button type="button" class="btn btn-primary w-100 fw-bold mt-3" onclick="guardarAnillamiento()">
              + Guardar Captura y Biometría
            </button>
          </form>
        </div>
      </div>

      <!-- TABLA Y EXPORTACIONES -->
      <div class="col-lg-7">
        <div class="card-panel">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
              <h4 class="form-title mb-1" style="border:none; padding:0;">Registros de Anillamiento</h4>
              <small class="text-muted">Base de datos biométrica local y sincronizada</small>
            </div>
            <div class="btn-group">
              <button class="btn btn-outline-danger btn-sm" onclick="eliminarUltimoRegistro()">🗑️ Borrar último</button>
              <button class="btn btn-outline-dark btn-sm" onclick="vaciarTodo()">⚠️ Vaciar todo</button>
              <button class="btn btn-outline-success btn-sm" onclick="exportarExcel()">📊 Excel</button>
              <button class="btn btn-outline-primary btn-sm" onclick="exportarKML()">🌍 KML</button>
            </div>
          </div>

          <div class="table-responsive">
            <table class="table table-hover align-middle table-history">
              <thead class="table-light">
                <tr>
                  <th>#</th>
                  <th>Fecha</th>
                  <th>Metálica</th>
                  <th>PVC</th>
                  <th>Especie</th>
                  <th>Ala</th>
                  <th>P8</th>
                  <th>Cola</th>
                  <th>Tarso</th>
                  <th>R5</th>
                </tr>
              </thead>
              <tbody id="tabla-anillamientos">
                <tr>
                  <td colspan="10" class="text-center text-muted py-3">No hay registros guardados.</td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    function obtenerLocalidadPorCoordenadas(lat, lng) {
      fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=10`)
        .then(response => response.json())
        .then(data => {
          if (data && data.display_name) {
            var address = data.address;
            var lugar = address.city || address.town || address.village || address.municipality || address.county || data.display_name.split(',')[0];
            var provincia = address.province || address.state || '';
            var pais = address.country_code ? address.country_code.toUpperCase() : '';
            document.getElementById('input-localidad').value = provincia ? `${lugar} / ${provincia} (${pais})` : `${lugar} (${pais})`;
          }
        });
    }

    var now = new Date();
    document.getElementById('input-fecha').value = now.toISOString().slice(0,10);

    var map = L.map('map').setView([39.7709, -0.1840], 11);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

    var marker = L.marker([39.7709, -0.1840], {draggable: true}).addTo(map);

    map.on('click', function(e) {
      marker.setLatLng(e.latlng);
      document.getElementById('input-coords').value = e.latlng.lat.toFixed(4) + ", " + e.latlng.lng.toFixed(4);
      obtenerLocalidadPorCoordenadas(e.latlng.lat, e.latlng.lng);
    });

    marker.on('dragend', function(e) {
      var latlng = marker.getLatLng();
      document.getElementById('input-coords').value = latlng.lat.toFixed(4) + ", " + latlng.lng.toFixed(4);
      obtenerLocalidadPorCoordenadas(latlng.lat, latlng.lng);
    });

    function actualizarMapaDesdeCoordenadas() {
      var partes = document.getElementById('input-coords').value.split(',');
      if (partes.length === 2) {
        var lat = parseFloat(partes[0].trim());
        var lng = parseFloat(partes[1].trim());
        if (!isNaN(lat) && !isNaN(lng)) {
          marker.setLatLng([lat, lng]);
          map.setView([lat, lng], 13);
          obtenerLocalidadPorCoordenadas(lat, lng);
        }
      }
    }

    var registros = JSON.parse(localStorage.getItem("anillamiento_biometria_data")) || [];

    function guardarLocal() {
      localStorage.setItem("anillamiento_biometria_data", JSON.stringify(registros));
    }

    function guardarAnillamiento() {
      var coords = document.getElementById('input-coords').value.split(',');
      var lat = parseFloat(coords[0]);
      var lng = parseFloat(coords[1]);

      var nuevo = {
        id: registros.length + 1,
        fecha: document.getElementById('input-fecha').value,
        localidad: document.getElementById('input-localidad').value,
        metal: document.getElementById('input-metal').value.trim(),
        pvc: document.getElementById('input-pvc').value.trim() || "-",
        especie: document.getElementById('input-especie').value,
        edad: document.getElementById('input-edad').value,
        sexo: document.getElementById('input-sexo').value,
        ala: document.getElementById('input-ala').value || "-",
        p8: document.getElementById('input-p8').value || "-",
        cola: document.getElementById('input-cola').value || "-",
        tarso: document.getElementById('input-tarso').value || "-",
        r5: document.getElementById('input-r5').value || "-",
        peso: document.getElementById('input-peso').value || "-",
        grasa: document.getElementById('input-grasa').value || "-",
        anillador: document.getElementById('input-anillador').value,
        lat: lat,
        lng: lng
      };

      registros.push(nuevo);
      guardarLocal();
      renderizarTabla();
    }

    function eliminarUltimoRegistro() {
      if (registros.length === 0) return alert("No hay datos.");
      if (confirm("¿Borrar última captura?")) {
        registros.pop();
        guardarLocal();
        renderizarTabla();
      }
    }

    function vaciarTodo() {
      if (registros.length === 0) return;
      if (confirm("⚠️ ¿Vaciar toda la base de datos biométrica local?")) {
        registros = [];
        guardarLocal();
        renderizarTabla();
      }
    }

    function renderizarTabla() {
      var tbody = document.getElementById('tabla-anillamientos');
      tbody.innerHTML = "";

      if (registros.length === 0) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center text-muted py-3">No hay registros.</td></tr>';
        return;
      }

      registros.forEach(r => {
        var tr = document.createElement('tr');
        tr.innerHTML = `
          <td><b>#${r.id}</b></td>
          <td>${r.fecha}</td>
          <td><span class="badge bg-dark">${r.metal}</span></td>
          <td><span class="badge bg-success">${r.pvc}</span></td>
          <td><i>${r.especie}</i></td>
          <td>${r.ala}</td>
          <td>${r.p8}</td>
          <td>${r.cola}</td>
          <td>${r.tarso}</td>
          <td>${r.r5}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function exportarExcel() {
      if (registros.length === 0) return alert("Sin datos.");
      var headers = "ID;Fecha;Lugar;Anilla Metal;Anilla PVC;Especie;Edad EURING;Sexo;Ala Max (mm);P8 (mm);Cola (mm);Tarso (mm);R5;Peso (g);Grasa;Anillador;Lat;Lng\n";
      var rows = registros.map(r => `${r.id};"${r.fecha}";"${r.localidad}";"${r.metal}";"${r.pvc}";"${r.especie}";"${r.edad}";"${r.sexo}";${r.ala};${r.p8};${r.cola};${r.tarso};"${r.r5}";${r.peso};"${r.grasa}";"${r.anillador}";${r.lat};${r.lng}`).join("\n");
      var blob = new Blob(["\uFEFF" + headers + rows], { type: 'text/csv;charset=utf-8;' });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "anillamiento_biometria.csv";
      link.click();
    }

    function exportarKML() {
      if (registros.length === 0) return alert("Sin datos.");
      var body = registros.map(r => `<Placemark><name>${r.metal} - ${r.especie}</name><description><![CDATA[Fecha: ${r.fecha}<br>PVC: ${r.pvc}<br>Ala: ${r.ala}mm | P8: ${r.p8}mm | Cola: ${r.cola}mm | Tarso: ${r.tarso}mm | R5: ${r.r5}]]></description><Point><coordinates>${r.lng},${r.lat},0</coordinates></Point></Placemark>`).join("");
      var kml = `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>Anillamiento</name>${body}</Document></kml>`;
      var blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
      var link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "estaciones_anillamiento.kml";
      link.click();
    }

    renderizarTabla();
  </script>

</body>
</html>
