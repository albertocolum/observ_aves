<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Introducción de Observaciones - Anillamiento</title>
  
  <!-- Estilos Bootstrap 5 para el diseño de la tabla/formulario -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Leaflet CSS para el mapa interactivo -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { background-color: #f8f9fa; font-family: system-ui, -apple-system, sans-serif; }
    .header-title { color: #2b6cb0; font-weight: 700; }
    .badge-ring { background-color: #28a745; color: white; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    #map { height: 500px; width: 100%; border-radius: 8px; border: 1px solid #dee2e6; }
    .table-details td { padding: 6px 12px; vertical-align: middle; }
    .table-details tr:nth-child(even) { background-color: #f2f2f2; }
  </style>
</head>
<body class="p-4">

<div class="container-fluid bg-white p-4 rounded shadow-sm">
  <!-- Título principal -->
  <div class="d-flex align-items-center gap-3 mb-4 border-bottom pb-3">
    <h3 class="header-title mb-0">Observación de <i id="txt-especie">Falco tinnunculus</i></h3>
    <span class="badge-ring" id="txt-anilla">A|5J</span>
  </div>

  <div class="row">
    <!-- PANEL IZQUIERDO: Formulario / Tabla de detalles -->
    <div class="col-lg-6 mb-4 mb-lg-0">
      <h6 class="fw-bold text-uppercase text-muted mb-3">Detalles de la observación</h6>
      
      <form id="form-observacion">
        <table class="table table-bordered table-details">
          <tbody>
            <tr>
              <th width="35%">Coordenadas (Lat, Long)</th>
              <td>
                <input type="text" id="input-coords" class="form-control form-control-sm" value="40.0178, 0.023" placeholder="Latitud, Longitud">
              </td>
            </tr>
            <tr>
              <th>Localidad</th>
              <td><input type="text" id="input-localidad" class="form-control form-control-sm" value="Castellón de la Plana (ES)"></td>
            </tr>
            <tr>
              <th>Fecha y Hora</th>
              <td><input type="datetime-local" id="input-fecha" class="form-control form-control-sm" value="2026-10-22T18:25"></td>
            </tr>
            <tr>
              <th>Edad</th>
              <td>
                <select id="input-edad" class="form-select form-select-sm">
                  <option selected>Desconocida</option>
                  <option>Pollo / Estatus 1</option>
                  <option>EUL / Adulto</option>
                </select>
              </td>
            </tr>
            <tr>
              <th>Sexo</th>
              <td>
                <select id="input-sexo" class="form-select form-select-sm">
                  <option selected>Desconocido</option>
                  <option>Macho</option>
                  <option>Hembra</option>
                </select>
              </td>
            </tr>
            <tr>
              <th>Condición</th>
              <td><input type="text" id="input-condicion" class="form-control form-control-sm" value="Observada viva"></td>
            </tr>
            <tr>
              <th>Tipo de marca</th>
              <td><input type="text" id="input-marca" class="form-control form-control-sm" value="Anilla en el tarso"></td>
            </tr>
            <tr>
              <th>Observador</th>
              <td><input type="text" id="input-observador" class="form-control form-control-sm" value="Anillador / Colaborador"></td>
            </tr>
          </tbody>
        </table>
        
        <button type="button" class="btn btn-primary w-100 fw-bold" onclick="actualizarMapa()">
          Actualizar Ubicación en el Mapa
        </button>
      </form>
    </div>

    <!-- PANEL DERECHO: Visor de Mapa Interactivo (Leaflet) -->
    <div class="col-lg-6">
      <div id="map"></div>
    </div>
  </div>
</div>

<!-- Scripts de Leaflet JS -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  // 1. Inicializar el mapa de Leaflet centrado en Castellón
  var map = L.map('map').setView([40.0178, 0.023], 14);

  // 2. Cargar mapa base estable (CartoDB Positron / OpenStreetMap libre)
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://carto.com/">CartoDB</a>'
  }).addTo(map);

  // 3. Icono de marcador rojo similar al portal oficial
  var redIcon = L.icon({
    iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-red.png',
    shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
    iconSize: [25, 41],
    iconAnchor: [12, 41],
    popupAnchor: [1, -34],
    shadowSize: [41, 41]
  });

  var marker = L.marker([40.0178, 0.023], {icon: redIcon, draggable: true}).addTo(map);

  // 4. Actualizar las coordenadas en la tabla cuando se arrastra el marcador
  marker.on('dragend', function(e) {
    var latlng = marker.getLatLng();
    document.getElementById('input-coords').value = latlng.lat.toFixed(5) + ", " + latlng.lng.toFixed(5);
  });

  // 5. Función para actualizar el mapa si el usuario introduce las coordenadas manualmente
  function actualizarMapa() {
    var rawCoords = document.getElementById('input-coords').value.split(',');
    if(rawCoords.length === 2) {
      var lat = parseFloat(rawCoords[0]);
      var lng = parseFloat(rawCoords[1]);
      if(!isNaN(lat) && !isNaN(lng)) {
        var newLatLng = new L.LatLng(lat, lng);
        marker.setLatLng(newLatLng);
        map.panTo(newLatLng);
      }
    }
  }
</script>

</body>
</html>
