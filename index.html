<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Observaciones de Aves con Marcas Especiales</title>
  
  <!-- Estilos Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    body { background-color: #f4f6f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    .map-header-container {
      position: relative;
      height: 380px;
      width: 100%;
      border-bottom: 3px solid #2b6cb0;
    }
    #map { height: 100%; width: 100%; }

    .form-container {
      max-width: 950px;
      margin: -40px auto 40px auto;
      position: relative;
      z-index: 1000;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      padding: 30px;
    }

    .form-title { color: #2d3748; font-weight: 700; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; margin-bottom: 24px; }
    .form-label { font-weight: 600; color: #4a5568; font-size: 0.9rem; }
    .required-asterisk { color: #e53e3e; }
    
    .ring-preview-box {
      background: #f8fafc;
      border: 2px dashed #cbd5e0;
      border-radius: 8px;
      padding: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }
    .ring-badge {
      font-family: 'Courier New', Courier, monospace;
      font-weight: 800;
      font-size: 1.4rem;
      padding: 8px 16px;
      border-radius: 6px;
      letter-spacing: 2px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .custom-pin {
      width: 24px;
      height: 24px;
      border-radius: 50% 50% 50% 0;
      background: #d97706;
      position: absolute;
      transform: rotate(-45deg);
      left: 50%;
      top: 50%;
      margin: -20px 0 0 -12px;
      border: 2px solid #ffffff;
      box-shadow: 0 3px 6px rgba(0,0,0,0.3);
    }
    .custom-pin::after {
      content: '';
      width: 10px;
      height: 10px;
      margin: 5px 0 0 5px;
      background: #ffffff;
      position: absolute;
      border-radius: 50%;
    }

    .table-history { font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- MAPA BANNER SUPERIOR -->
  <div class="map-header-container">
    <div id="map"></div>
  </div>

  <!-- FORMULARIO DE DETALLES DE OBSERVACIÓN -->
  <div class="form-container">
    
    <div class="row mb-4 align-items-center">
      <label class="col-sm-4 col-form-label text-sm-end fw-bold">Nombre de la localidad <span class="required-asterisk">*</span></label>
      <div class="col-sm-8">
        <input type="text" id="input-localidad" class="form-control" value="Castellón / Costa Azahar (ES)" placeholder="Escribe un nombre o pulsa en el mapa...">
      </div>
    </div>

    <h4 class="form-title">Completar los detalles de la observación</h4>

    <!-- Vista previa dinámica de la anilla/marca -->
    <div class="ring-preview-box">
      <div>
        <span class="fw-bold text-secondary d-block">VISTA PREVIA DE LA MARCA</span>
        <small class="text-muted">Ajusta la inscripción y colores abajo</small>
      </div>
      <div id="badge-preview" class="ring-badge" style="background-color: #28a745; color: #ffffff;">
        A5J
      </div>
    </div>

    <form id="form-observacion">
      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label class="form-label">Fecha y Hora <span class="required-asterisk">*</span></label>
          <input type="datetime-local" id="input-fecha" class="form-control" required>
        </div>

        <div class="col-md-6">
          <label class="form-label">Especie <span class="required-asterisk">*</span></label>
          <select id="input-especie" class="form-select" required>
            <option value="Falco tinnunculus" selected>Cernícalo vulgar (Falco tinnunculus)</option>
            <option value="Falco naumanni">Cernícalo primilla (Falco naumanni)</option>
            <option value="Tyto alba">Lechuza común (Tyto alba)</option>
            <option value="Ciconia ciconia">Cigüeña blanca (Ciconia ciconia)</option>
            <option value="Larus michahellis">Gaviota patiamarilla (Larus michahellis)</option>
            <option value="Phoenicopterus roseus">Flamenco común (Phoenicopterus roseus)</option>
          </select>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-4">
          <label class="form-label">Inscripción / Anilla <span class="required-asterisk">*</span></label>
          <input type="text" id="input-inscripcion" class="form-control" value="A5J" placeholder="Ej: A5J" oninput="actualizarVistaAnilla()">
        </div>

        <div class="col-md-4">
          <label class="form-label">Color de fondo de la marca <span class="required-asterisk">*</span></label>
          <select id="input-bg-color" class="form-select" onchange="actualizarVistaAnilla()">
            <option value="#28a745" selected>Verde</option>
            <option value="#0056b3">Azul</option>
            <option value="#d9534f">Rojo</option>
            <option value="#ffc107">Amarillo</option>
            <option value="#ffffff">Blanco</option>
            <option value="#000000">Negro</option>
            <option value="#fd7e14">Naranja</option>
          </select>
        </div>

        <div class="col-md-4">
          <label class="form-label">Color de la inscripción
